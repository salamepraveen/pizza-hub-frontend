<nav class="auth-nav">
  <div class="logo" routerLink="/">PizzaHub</div>
  <a routerLink="/" class="back-link">← Back to Home</a>
</nav>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your PizzaHub account</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter your username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" (keyup.enter)="login()">
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="login-btn" [disabled]="loading" (click)="login()">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
    </div>
  </div>
</div>
