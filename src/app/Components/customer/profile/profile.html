<div class="profile-container">
  <h2>My Profile</h2>
  
  <div class="message success" *ngIf="message">{{ message }}</div>
  <div class="message error" *ngIf="error">{{ error }}</div>

  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <div class="profile-card" *ngIf="!loading">
    <div class="form-group">
      <label>Username</label>
      <input type="text" [value]="user.username" disabled class="disabled-input">
      <small>Username cannot be changed</small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="user.email" [disabled]="!isEditing" [class.disabled-input]="!isEditing">
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" [(ngModel)]="user.phoneNumber" [disabled]="!isEditing" [class.disabled-input]="!isEditing" placeholder="Enter phone number">
    </div>

    <div class="form-group">
      <label>Delivery Address</label>
      <textarea [(ngModel)]="user.address" [disabled]="!isEditing" [class.disabled-input]="!isEditing" placeholder="Enter delivery address"></textarea>
    </div>

    <div class="action-buttons">
      <button class="edit-btn" *ngIf="!isEditing" (click)="toggleEdit()">Edit Profile</button>
      <button class="save-btn" *ngIf="isEditing" (click)="saveProfile()">Save Changes</button>
      <button class="cancel-btn" *ngIf="isEditing" (click)="toggleEdit()">Cancel</button>
    </div>
  </div>
</div>
